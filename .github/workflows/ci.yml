name: Windows and macOS tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[dev]"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install DOM test dependencies
        run: npm install --prefix .dom-tests jsdom@26.1.0 --no-audit --no-fund
      - run: python -m pytest -q
