[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fastmoss-auto"
version = "0.1.3"
description = "TikTok cross-border research desktop application"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "pandas>=2.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7"]

[project.scripts]
fastmoss-auto = "fastmoss_auto.app:main"

[tool.setuptools.packages.find]
include = ["fastmoss_auto*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
